name: I have an idea
description: Suggest something that would make PantryPedia better
title: "[Idea]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: How would it help? (optional)
      description: A short example from your own cooking makes this much easier to judge.
    validations:
      required: false
